# XcodeGen spec — a fallback / regeneration path.
#
# The checked-in CommandDeck.xcodeproj is the primary project and you do
# not need this file to build. Keep it if you'd rather have the project
# generated from a readable spec than tracked as a pbxproj in git:
#
#   brew install xcodegen
#   xcodegen generate
#
# Regenerating overwrites CommandDeck.xcodeproj.

name: CommandDeck
options:
  bundleIdPrefix: com.umerzia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  CommandDeck:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: CommandDeck
    entitlements:
      path: CommandDeck.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umerzia.CommandDeck
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Command Deck"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID unlocks the values saved in your Notes & Logins vault."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
